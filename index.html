<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hauntlet 2 Advisor</title>
    <style>
      :root {
        --bg: #f6f4fa;
        --fg: #1c1a22;
        --card: #fff;
        --bd: #d9d4e3;
        --ac: #6d28d9;
        --mut: #6b6677;
        --ok: #15803d;
        --bad: #b91c1c;
        --okbg: #e3f6e9;
        --badbg: #fde4e4;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #15131a;
          --fg: #ece9f3;
          --card: #211e29;
          --bd: #3a3547;
          --ac: #a78bfa;
          --mut: #a29cb0;
          --ok: #4ade80;
          --bad: #f87171;
          --okbg: #12301c;
          --badbg: #3a1616;
        }
      }
      :root[data-theme='dark'] {
        --bg: #15131a;
        --fg: #ece9f3;
        --card: #211e29;
        --bd: #3a3547;
        --ac: #a78bfa;
        --mut: #a29cb0;
        --ok: #4ade80;
        --bad: #f87171;
        --okbg: #12301c;
        --badbg: #3a1616;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Arial,
          sans-serif;
      }
      #app {
        max-width: 560px;
        margin: 0 auto;
        padding: 12px;
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: 'top' 'doors' 'advice' 'next';
      }
      @media (min-width: 900px) {
        #app {
          max-width: 1000px;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          grid-template-areas: 'top advice' 'doors advice' 'next advice';
          align-items: start;
        }
        #advice {
          position: sticky;
          top: 12px;
        }
      }
      #top {
        grid-area: top;
      }
      #doorcard {
        grid-area: doors;
      }
      #advice {
        grid-area: advice;
      }
      #nextwrap {
        grid-area: next;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px;
      }
      h2 {
        font-size: 12px;
        margin: 0 0 8px;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .sp {
        justify-content: space-between;
      }
      button,
      select {
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 6px 12px;
        min-height: 40px;
        cursor: pointer;
      }
      button.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      button.g.on {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
      }
      button.s.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #06210f;
      }
      button.pri {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
        font-weight: 600;
        width: 100%;
        min-height: 48px;
        font-size: 16px;
      }
      .inv {
        display: flex;
        gap: 4px;
        align-items: center;
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 2px 4px;
      }
      .inv button {
        min-height: 32px;
        padding: 2px 10px;
      }
      .big {
        font-size: 20px;
        font-weight: 700;
        min-width: 28px;
        text-align: center;
      }
      .rin {
        width: 56px;
        height: 40px;
        font:
          700 20px/1 system-ui,
          sans-serif;
        text-align: center;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 0;
        outline: none;
      }
      .rin:focus {
        border-color: var(--ac);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.35);
      }
      html,
      body,
      button,
      select,
      input {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .mut {
        color: var(--mut);
        font-size: 13px;
      }
      .rec {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.3;
      }
      .boxes {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 10px 0;
      }
      .dcell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        flex: 1;
        max-width: 100px;
        min-width: 0;
      }
      .box {
        width: 100%;
        height: 84px;
        font:
          800 36px/1 system-ui,
          sans-serif;
        text-align: center;
        text-transform: uppercase;
        border: 2px solid var(--bd);
        border-radius: 12px;
        background: var(--card);
        color: var(--fg);
        padding: 0;
        caret-color: transparent;
        outline: none;
      }
      .box.filled {
        border-color: var(--fg);
      }
      .box.act {
        border-color: var(--ac);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.35);
      }
      .box.ghost {
        background: var(--badbg);
        border-color: var(--bad);
      }
      .box.safe {
        background: var(--okbg);
        border-color: var(--ok);
      }
      .nm {
        font-size: 12px;
        color: var(--mut);
        height: 16px;
      }
      .mini {
        display: flex;
        gap: 4px;
      }
      .mini button {
        min-height: 32px;
        padding: 2px 8px;
        font-size: 12px;
      }
      .picker {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
        gap: 6px;
        margin-bottom: 8px;
      }
      .picker button {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 6px 4px;
        min-height: 48px;
      }
      .picker b {
        font-size: 20px;
        line-height: 1.1;
      }
      .picker span {
        font-size: 11px;
        color: var(--mut);
      }
      .sm {
        min-height: 34px;
        padding: 2px 10px;
        font-size: 13px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      td,
      th {
        padding: 5px 6px;
        border-bottom: 1px solid var(--bd);
        text-align: left;
      }
      tr.best td {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="card" id="top"></div>
      <div class="card" id="doorcard"></div>
      <div id="advice"></div>
      <div id="nextwrap">
        <button class="pri" data-a="next">Next round (Enter)</button>
        <div class="row sp" style="margin-top: 8px">
          <span class="mut">Odds fitted to your logged runs.</span
          ><button class="sm" data-a="reset">New run</button>
        </div>
      </div>
    </div>
    <script>
      /* ===== Hauntlet 2 door advisor =====
 Model fitted to your two logs (hauntlet2.csv + the full run):
 - each room has T ghosts in total, set by the room number (1 early in each block, 2 later, always 3 in the final area as a 2+1 split),
   placed on doors in proportion to a risk weight per door type, so a door can hold 2 ghosts (damage = ghosts behind it);
 - shock doors always add 1 damage; golden doors never have ghosts and give +1 permanent heart;
 - evidence (phone arrow, doors known safe) is applied exactly by enumerating ghost placements;
 - the future is a dynamic program over every remaining room (not a short look-ahead): room, hearts, max hearts, heal potions, wands, phones,
   1-room hearts and keys, with door item drops, keys being used up, the waiting-room pick (heal, wand or golden key) and golden doors included;
   future rooms use every possible door-type combination, grouped into 8 equally likely kinds of room;
   door drops cover keys, ghost potions, phones, wands, heal potions and golden keys; a bounce door sends you to a random other door (its items and golden doors included). */
      const WT = {
        '?': 1,
        low: 1,
        mod: 1.44,
        high: 2.43,
        key: 0.3,
        web: 0.2,
        nightmare: 1.65,
        bounce: 1.14,
        shock: 0.52,
        golden: 0,
      };
      const PI = {
        '?': 0.3,
        low: 0.3,
        mod: 0.5,
        high: 0.5,
        key: 0.22,
        web: 0,
        nightmare: 0.45,
        bounce: 0.1,
        shock: 0.5,
        golden: 0,
      }; // chance a door gives an item (small sample)
      const FREQ = {
        B1: { 'low': 0.481, 'mod': 0.309, 'key': 0.123, 'high': 0.086 },
        BT: {
          'shock': 0.059,
          'key': 0.215,
          'low': 0.194,
          'mod': 0.215,
          'high': 0.059,
          'web': 0.145,
          'nightmare': 0.091,
          'bounce': 0.022,
        },
        BF: {
          'web': 0.073,
          'mod': 0.145,
          'low': 0.127,
          'high': 0.127,
          'key': 0.346,
          'nightmare': 0.109,
          'shock': 0.036,
          'bounce': 0.036,
        },
      }; // door-type mix by phase (your logs)
      const GK = 0.14,
        GHL = 0.02,
        GG = 0.01,
        PG0 = 0.02,
        PG1 = 0.22,
        NB = 8; // key drops per room; chance another player's golden key puts a golden door in a room (before / from door 28)
      const GP = 0.1,
        GH = 0.065,
        GW = 0.03,
        GI = GP + GH + GW + GHL + GG,
        USE = 0.56; // per-room chance a door drops a ghost potion / phone / wand (from your full run); share of door items that are not keys
      const PTM = [5.49, 1.489, 1.846, 3.897, 4.0],
        ARROW = 0.55,
        TOT = 45,
        REW = 0.5;
      const FACT = [1, 1, 2, 6, 24];
      const sg = (x) => 1 / (1 + Math.exp(-x));
      // total ghosts in a room follow a fixed schedule: 1 early in each block of 10, 2 later (from room 8, 16, 24, 32), always 3 from room 41
      const S2 = 0.53,
        U3 = 0.05; // chance two ghosts share one door (T=2); chance the final room is 1+1+1 instead of 2+1
      function tpmf(room) {
        const R = room >= 41 ? 3 : 1 + ((room % 10) + 2 * Math.floor(room / 10) >= 8 ? 1 : 0);
        let p = [0, 0, 0, 0];
        if (room === 1) p = [0.75, 0.25, 0, 0];
        else {
          p[R] = 0.93;
          if (R > 0) p[R - 1] += 0.035;
          if (R < 3) p[R + 1] += 0.035;
        }
        const s = p.reduce((x, y) => x + y, 0);
        return p.map((x) => x / s);
      }

      const ixs = (h, a, b, c, d, e) => ((((h * 3 + a) * 3 + b) * 3 + c) * 3 + d) * 3 + e; // hearts, heal potions, wands, phones, 1-room hearts, keys (each item capped at 2)
      const bandF = (r) => (r <= 9 ? FREQ.B1 : r <= 36 ? FREQ.BT : FREQ.BF);
      let ROOMS = null;
      const FACT_ = [1, 1, 2, 6, 24],
        shiftP = (q) => [q[0] + q[1], q[2], q[3], 0];
      // exact enumeration of every door-type combination for each future room, grouped into NB equally likely kinds of room
      function buildRooms() {
        ROOMS = [null];
        const TYS = ['low', 'mod', 'high', 'key', 'web', 'nightmare', 'bounce', 'shock'],
          memo = {};
        const pm = (types, j, room) => {
          const tk =
              room === 1
                ? 0
                : room >= 41
                  ? 3
                  : 1 + ((room % 10) + 2 * Math.floor(room / 10) >= 8 ? 1 : 0),
            key = types.join() + '|' + j + '|' + tk;
          let v = memo[key];
          if (!v) {
            const P = post(types, j < 0 ? new Set() : new Set([j]), new Set(), room);
            v = memo[key] = { D: dmgAll(types, P.m), rev: P.rev };
          }
          return v;
        };
        for (let r = 1; r <= TOT; r++) {
          const room = r + Math.floor((r - 1) / 9),
            f = bandF(r),
            n = r >= 37 ? 4 : 3,
            combos = [];
          (function rec(st, cur) {
            if (cur.length === n) {
              combos.push(cur.slice());
              return;
            }
            for (let i = st; i < TYS.length; i++) {
              cur.push(TYS[i]);
              rec(i, cur);
              cur.pop();
            }
          })(0, []);
          let tot = 0;
          const rows = [];
          for (const types of combos) {
            const cnt = {};
            types.forEach((t) => (cnt[t] = (cnt[t] || 0) + 1));
            let pr = FACT_[n];
            for (const t in cnt) pr *= Math.pow(f[t] || 0, cnt[t]) / FACT_[cnt[t]];
            if (pr <= 0) continue;
            const ex = (d) => d[1] + 2 * d[2] + 3 * d[3],
              best = (ds, skip, nk) => {
                let bi = -1,
                  be = 9;
                ds.forEach((d, i) => {
                  if (i === skip || (nk && types[i] === 'key')) return;
                  const e = ex(d);
                  if (e < be) {
                    be = e;
                    bi = i;
                  }
                });
                return bi;
              };
            const P0 = pm(types, -1, room),
              D0 = P0.D,
              bo = best(D0, -1, false);
            let bn = best(D0, -1, true);
            if (bn < 0) bn = bo;
            const K0 = D0[bo],
              N0 = D0[bn],
              pK0 = types[bo] === 'key' && bn !== bo ? 1 : 0;
            const K1 = [0, 0, 0, 0],
              N1 = [0, 0, 0, 0];
            let pK1 = 0,
              w1 = 0;
            for (let j = 0; j < n; j++) {
              const rv = P0.rev[j];
              if (rv <= 0) continue;
              const D1 = pm(types, j, room).D,
                b1 = best(D1, j, false);
              let n1 = best(D1, j, true);
              if (n1 < 0) n1 = b1;
              for (let d = 0; d < 4; d++) {
                K1[d] += rv * D1[b1][d];
                N1[d] += rv * D1[n1][d];
              }
              pK1 += rv * (types[b1] === 'key' && n1 !== b1 ? 1 : 0);
              w1 += rv;
            }
            const rest = Math.max(0, 1 - w1);
            for (let d = 0; d < 4; d++) {
              K1[d] += rest * K0[d];
              N1[d] += rest * N0[d];
            }
            pK1 += rest * pK0;
            rows.push({ pr, e: ex(K0), K0, N0, pK0, K1, N1, pK1 });
            tot += pr;
          }
          rows.sort((x, y) => x.e - y.e);
          const B = [];
          let acc = 0,
            bi = 1;
          const z = () => ({
            w: 0,
            K0: [0, 0, 0, 0],
            N0: [0, 0, 0, 0],
            K1: [0, 0, 0, 0],
            N1: [0, 0, 0, 0],
            pK0: 0,
            pK1: 0,
          });
          let cur = z();
          const flush = () => {
            if (cur.w > 0) {
              const w = cur.w,
                s = (v) => v.map((x) => x / w),
                K0 = s(cur.K0),
                N0 = s(cur.N0),
                K1 = s(cur.K1),
                N1 = s(cur.N1);
              B.push({
                K0,
                N0,
                K1,
                N1,
                K0s: shiftP(K0),
                N0s: shiftP(N0),
                K1s: shiftP(K1),
                N1s: shiftP(N1),
                pK0: cur.pK0 / w,
                pK1: cur.pK1 / w,
              });
            }
            cur = z();
          };
          for (const x of rows) {
            const p = x.pr / tot;
            cur.w += p;
            for (let d = 0; d < 4; d++) {
              cur.K0[d] += p * x.K0[d];
              cur.N0[d] += p * x.N0[d];
              cur.K1[d] += p * x.K1[d];
              cur.N1[d] += p * x.N1[d];
            }
            cur.pK0 += p * x.pK0;
            cur.pK1 += p * x.pK1;
            acc += p;
            if (acc >= bi / NB - 1e-9 && bi < NB) {
              flush();
              bi++;
            }
          }
          flush();
          ROOMS.push(B);
        }
      }
      const DPC = [{}, {}, {}, {}, {}, {}],
        LVL = 4; // LVL = how many later golden-key jumps the plan can see
      // dynamic program over every remaining room. lvl 0 = no golden doors; lvl 1 = golden doors from other players' keys and the waiting-room golden key (jumping to the lvl-0 table with one more max heart)
      function dpBuild(M, lvl) {
        const C = DPC[lvl];
        if (C[M]) return C[M];
        if (!ROOMS) buildRooms();
        const G = lvl > 0 && M < 10 ? dpBuild(M + 1, lvl - 1) : null,
          SZ = (M + 1) * 243,
          V = [];
        const A = (r, h, a, b, p, g, k) => {
          if (r >= TOT) return 1;
          const Vn = V[r + 1];
          if (r % 9 === 0 && r <= 36) {
            let v = Math.max(
              Vn[ixs(h, Math.min(2, a + 1), b, p, g, k)],
              Vn[ixs(h, a, Math.min(2, b + 1), p, g, k)],
            );
            if (G) {
              const gv = G.V[r + 1][ixs(Math.min(M + 1, h + 1), a, b, p, g, k)];
              if (gv > v) v = gv;
            }
            return v;
          }
          return Vn[ixs(h, a, b, p, g, k)];
        };
        for (let r = TOT; r >= 1; r--) {
          const MX = new Float64Array(SZ),
            Bk = ROOMS[r],
            pg = lvl > 0 ? (r >= 28 ? PG1 : PG0) : 0,
            Vr = (V[r] = new Float64Array(SZ));
          for (let h = 1; h <= M; h++)
            for (let a = 0; a < 3; a++)
              for (let b = 0; b < 3; b++)
                for (let p = 0; p < 3; p++)
                  for (let g = 0; g < 3; g++)
                    for (let k = 0; k < 3; k++)
                      MX[ixs(h, a, b, p, g, k)] =
                        (1 - GI - GK) * A(r, h, a, b, p, g, k) +
                        GP * A(r, h, a, b, p, Math.min(2, g + 1), k) +
                        GH * A(r, h, a, b, Math.min(2, p + 1), g, k) +
                        GW * A(r, h, a, Math.min(2, b + 1), p, g, k) +
                        GK * A(r, h, a, b, p, g, Math.min(2, k + 1)) +
                        GHL * A(r, h, Math.min(2, a + 1), b, p, g, k) +
                        GG *
                          (G
                            ? G.A(r, Math.min(M + 1, h + 1), a, b, p, g, k)
                            : A(r, h, a, b, p, g, k));
          const ev = (q, h2, rest) => {
            let v = 0;
            if (q[0] > 0) v += q[0] * MX[h2 * 243 + rest];
            if (h2 > 1 && q[1] > 0) v += q[1] * MX[(h2 - 1) * 243 + rest];
            if (h2 > 2 && q[2] > 0) v += q[2] * MX[(h2 - 2) * 243 + rest];
            if (h2 > 3 && q[3] > 0) v += q[3] * MX[(h2 - 3) * 243 + rest];
            return v;
          };
          const rs = (a, b, p, g, k) => (((a * 3 + b) * 3 + p) * 3 + g) * 3 + k;
          const play = (h, a, b, p, g, k, x, arrow) => {
            let best = 0;
            for (let uh = 0; uh <= (a > 0 && h < M ? 1 : 0); uh++) {
              const h2 = uh ? M : h,
                a2 = a - uh;
              for (let im = 0; im < 3; im++) {
                if (im === 1 && !b) continue;
                if (im === 2 && !g) continue;
                const b2 = b - (im === 1),
                  g2 = g - (im === 2);
                if (im === 1) {
                  const v = MX[h2 * 243 + rs(a2, b2, p, g2, k)];
                  if (v > best) best = v;
                  continue;
                }
                for (let up = 0; up <= (p > 0 && !im && !arrow ? 1 : 0); up++) {
                  const p2 = p - up,
                    r0 = rs(a2, b2, p2, g2, k),
                    rk = k > 0 ? rs(a2, b2, p2, g2, k - 1) : 0;
                  const qN = im ? (up ? x.N1s : x.N0s) : up ? x.N1 : x.N0,
                    qK = im ? (up ? x.K1s : x.K0s) : up ? x.K1 : x.K0,
                    pk = up ? x.pK1 : x.pK0;
                  let val = ev(qN, h2, r0);
                  if (k > 0 && pk > 0) {
                    const vK = ev(qK, h2, rk);
                    val = (1 - pk) * val + pk * Math.max(val, vK);
                  }
                  if (val > best) best = val;
                }
              }
            }
            return best;
          };
          for (let h = 1; h <= M; h++)
            for (let a = 0; a < 3; a++)
              for (let b = 0; b < 3; b++)
                for (let p = 0; p < 3; p++)
                  for (let g = 0; g < 3; g++)
                    for (let k = 0; k < 3; k++) {
                      let tot = 0;
                      for (let q = 0; q < Bk.length; q++) {
                        const x = Bk[q];
                        const xa = {
                          N0: x.N1,
                          K0: x.K1,
                          N0s: x.N1s,
                          K0s: x.K1s,
                          pK0: x.pK1,
                          N1: x.N1,
                          K1: x.K1,
                          N1s: x.N1s,
                          K1s: x.K1s,
                          pK1: x.pK1,
                        };
                        tot +=
                          ARROW * play(h, a, b, p, g, k, x.arrowX || (x.arrowX = xa), true) +
                          (1 - ARROW) * play(h, a, b, p, g, k, x, false);
                      }
                      let v = tot / Bk.length;

        }
        if (F.doors.slice(0, F.n).every((d) => d.t === '?')) {
          $('advice').innerHTML =
            '<div class="card"><h2>Advice</h2><div class="rec">Enter the door types to get a recommendation.</div></div>';
          return;
        }
        const a = advise(),
          p = a.plan,
          ok = a.out.filter((x) => !x.locked),
          t = ok[0],
          nm = (x) => (x.t === '?' ? 'unknown type' : x.t);
        const held = S.inv.heart_potion + S.inv.wand + S.inv.phone + S.inv.ghost_potion;
        const risk = (x) =>
          `${pct(x.hit)} chance of a hit` + (x.p2 > 0.12 ? ' (could cost 2 hearts)' : '');
        let rec,
          sub = '';
        if (!ok.length)
          rec = 'Every door is locked. You need a key, or wait to see if someone uses one.';
        else if (t.t === 'golden' && p.kind !== 'phone') {
          rec = `Open the golden door (Door ${t.i + 1}): +1 permanent heart.`;
          sub = 'After you save it, tap "+1 golden door" at the top.';
        } else if (p.kind === 'key') {
          rec = `Use one of your keys to remove the locks (then tap Locks removed and take a key off your items), then open Door ${t.i + 1} (${nm(t)}): ${risk(t)}.`;
          sub = `Worth about +${pp(p.gain)} run-clear chance.`;
        } else if (p.kind === 'phone') {
          rec = `Use your phone now, then tap Ghost on the door it points at and I will re-rank (about +${pp(p.gain)} run-clear chance).`;
          sub = `Without it: Door ${t.i + 1} (${nm(t)}), ${risk(t)}.`;
        } else if (p.kind === 'use') {
          const st = [];
          if (p.uh) st.push('drink your heal potion');
          if (p.im === 1) st.push('use your wand (clears every ghost)');
          if (p.im === 2) st.push('drink your 1-room heart (absorbs one hit)');
          const f = st.join(', then ');
          rec = f.charAt(0).toUpperCase() + f.slice(1) + `. Then open Door ${t.i + 1} (${nm(t)}).`;
          sub = `Worth about +${pp(p.gain)} run-clear chance.`;
        } else {
          rec = `Open Door ${t.i + 1} (${nm(t)}): ${risk(t)}.`;
          if (held) sub = 'Keep your items for now. Spending them here would not pay off.';
        }
        if (ok.length && t.t === 'web' && held + S.inv.key)
          sub = (sub ? sub + ' ' : '') + 'Careful: web doors steal all your items, keys included.';
        {
          const sf = ok
            .filter((x) => x.t !== 'golden')
            .reduce((m, x) => (!m || x.hit < m.hit ? x : m), null);
          if (sf && t.t !== 'golden' && sf.i !== t.i && t.hit - sf.hit > 0.005)
            sub =
              (sub ? sub + ' ' : '') +
              `Door ${sf.i + 1} (${nm(sf)}) is safer (${pct(sf.hit)} hit chance) but Door ${t.i + 1} is picked because it drops items more often and the extra hit risk costs less than that is worth (${pp(t.ev - sf.ev)} run-clear difference).`;
        }
        if (S.inv.golden_key > 0 && ok.length && t.t !== 'golden')
          sub =
            (sub ? sub + ' ' : '') + 'You hold a golden key: take the golden door if one shows up.';
        if (ok.length && t.t === 'shock')
          sub = (sub ? sub + ' ' : '') + 'Shock doors always cost 1 heart.';
        if (a.out.some((x) => x.t === 'golden' && x.locked))
          sub =
            (sub ? sub + ' ' : '') +
            'The golden door needs a golden key: tap "Golden key available" if you or someone has one.';
        const eff = (x) =>
          x.t === 'golden'
            ? '+1 heart'
            : p.kind === 'use' && p.im === 1
              ? x.t === 'shock'
                ? '100%'
                : '0%'
              : p.kind === 'use' && p.im === 2
                ? pct(x.p2)
                : pct(x.hit);
        const rows = a.out
          .map(
            (x, k) =>
              `<tr${k === 0 && !x.locked ? ' class="best"' : ''}><td>Door ${x.i + 1} · ${nm(x)}</td><td>${x.locked ? 'locked' : eff(x)}</td><td>${x.locked ? '-' : pp(x.ev)}</td></tr>`,
          )
          .join('');
        $('advice').innerHTML =
          `<div class="card"><h2>Advice</h2><div class="rec">${rec}</div>${sub ? `<div class="mut" style="margin-top:6px">${sub}</div>` : ''}<table style="margin-top:10px"><tr><th>Door</th><th>Hit</th><th>Run clears</th></tr>${rows}</table></div>`;
      }
      function render(focus) {
        renderTop();
        renderDoors();
        renderAdvice();
        if (focus !== false && !isWR(S.round) && !isEnd(S.round)) focusBox(0);
      }
      function act(a, v, i) {
        switch (a) {
          case 'round':
            S.round = Math.max(1, Math.min(50, S.round + +v));
            newRoom();
            persist();
            render();
            return;
          case 'next':
            S.round = Math.min(50, S.round + 1);
            newRoom();
            persist();
            render();
            return;
          case 'reset':
            S = fresh();
            newRoom();
            persist();
            render();
            return;
          case 'hearts':
            S.hearts = Math.min(S.maxH, +v);
            break;
          case 'maxh':
            S.maxH = Math.max(1, Math.min(10, S.maxH + +v));
            S.hearts = Math.min(S.hearts, S.maxH);
            persist();
            renderTop();
            renderAdvice();
            return;
          case 'gold':
            S.maxH = Math.min(10, S.maxH + 1);
            S.hearts = Math.min(S.maxH, S.hearts + 1);
            persist();
            renderTop();
            renderAdvice();
            return;
          case 'inv': {
            const [k, d] = v.split('|');
            const mx = ITEMS.find((x) => x[0] === k)[2];
            S.inv[k] = Math.max(0, Math.min(mx, S.inv[k] + +d));
            break;
          }
          case 'n':
            F.n = +v;
            if (F.active >= F.n) F.active = 0;
            persist();
            renderDoors();
            renderAdvice();
            return;
          case 'kb':
            S.kb = !S.kb;
            persist();
            renderDoors();
            return;
          case 'tog':
            F[v] = !F[v];
            renderDoors();
            renderAdvice();
            return;
          case 'ghost':
            flag(i, 'g');
            return;
          case 'safe':
            flag(i, 's');
            return;
          case 'pick': {
            const t = ch2t(v);
            if (t === null) return;
            const k = F.active;
            setDoor(k, t);
            focusBox(Math.min(k + 1, F.n - 1));
            return;
          }
        }
        persist();
        renderTop();
        renderAdvice();
      }
      document.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b || !b.dataset.a) return;
        act(b.dataset.a, b.dataset.v, +b.dataset.i);
      });
      document.addEventListener('change', (e) => {
        const t = e.target;
        if (t.tagName === 'SELECT' && t.dataset.a) act(t.dataset.a, t.value);
      });
      document.addEventListener('mousedown', (e) => {
        if (e.target.closest('.nofocus')) e.preventDefault();
      });
      document.addEventListener('focusin', (e) => {
        const t = e.target;
        if (t.classList && t.classList.contains('box')) {
          F.active = +t.dataset.i;
          refreshDoors();
          try {
            t.select();
          } catch (x) {}
        }
      });
      document.addEventListener('input', (e) => {
        const t = e.target;
        if (!t.classList || !t.classList.contains('box')) return;
        const i = +t.dataset.i,
          v = t.value,
          c = v.slice(-1).toLowerCase();
        if (!v) {
          if (F.doors[i].t !== '?') setDoor(i, '?');
          else refreshDoors();
          return;
        }
        if (c === 'a' || c === 's') {
          flag(i, c === 'a' ? 'g' : 's');
          return;
        }
        const ty = ch2t(c);
        if (ty === null) {
          refreshDoors();
          return;
        }
        setDoor(i, ty);
        focusBox(Math.min(i + 1, F.n - 1));
      });
      document.addEventListener('keydown', (e) => {
        const t = e.target,
          isBox = t.classList && t.classList.contains('box');
        if (e.key === 'Enter' && (isBox || t === document.body)) {
          e.preventDefault();
          act('next');
          return;
        }
        if (!isBox) return;
        const i = +t.dataset.i;
        if (e.key === 'Backspace') {
          e.preventDefault();
          if (F.doors[i].t !== '?' || F.doors[i].a || F.doors[i].b === 'safe') {
            F.doors[i].a = false;
            F.doors[i].b = '?';
            setDoor(i, '?');
            focusBox(i);
          } else if (i > 0) {
            setDoor(i - 1, '?');
            focusBox(i - 1);
          }
          return;
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          focusBox(Math.max(0, i - 1));
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          focusBox(Math.min(F.n - 1, i + 1));
        } else if (/^[1-4]$/.test(e.key)) {
          e.preventDefault();
          if (+e.key <= F.n) focusBox(+e.key - 1);
        }
      });
      document.addEventListener('paste', (e) => {
        const t = e.target;
        if (!t.classList || !t.classList.contains('box')) return;
        e.preventDefault();
        const txt = (e.clipboardData || window.clipboardData).getData('text');
        let i = +t.dataset.i;
        for (const c of txt) {
          const ty = ch2t(c);
          if (ty === null) continue;
          if (i >= F.n) break;
          F.doors[i].t = ty;
          i++;
        }
        refreshDoors();
        renderAdvice();
        focusBox(Math.min(i, F.n - 1));
      });
      // type a round number directly: commits on Enter or when you leave the field
      function commitRound(t) {
        const n = parseInt(t.value, 10);
        if (!n || n < 1 || n > 50 || n === S.round) {
          t.value = S.round;
          return false;
        }
        S.round = n;
        newRoom();
        persist();
        return true;
      }
      document.addEventListener('focusin', (e) => {
        const t = e.target;
        if (t.id === 'rin')
          setTimeout(() => {
            try {
              t.select();
            } catch (x) {}
          }, 0);
      });
      document.addEventListener('input', (e) => {
        const t = e.target;
        if (t.id === 'rin') t.value = t.value.replace(/\D/g, '');
      });
      document.addEventListener('change', (e) => {
        const t = e.target;
        if (t.id === 'rin' && commitRound(t)) render(false);
      });
      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t.id !== 'rin' || e.key !== 'Enter') return;
        e.preventDefault();
        t.blur();
        if (!isWR(S.round) && !isEnd(S.round)) focusBox(0);
      });
      newRoom();
      render();
    </script>
  </body>
</html>
