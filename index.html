<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hauntlet 2 Advisor</title>
<style>
:root{--bg:#f6f4fa;--fg:#1c1a22;--card:#fff;--bd:#d9d4e3;--ac:#6d28d9;--mut:#6b6677;--ok:#15803d;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131a;--fg:#ece9f3;--card:#211e29;--bd:#3a3547;--ac:#a78bfa;--mut:#a29cb0;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#15131a;--fg:#ece9f3;--card:#211e29;--bd:#3a3547;--ac:#a78bfa;--mut:#a29cb0;--ok:#4ade80;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:12px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sp{justify-content:space-between}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;min-height:40px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.g.on{background:var(--bad);border-color:var(--bad)}
button.s.on{background:var(--ok);border-color:var(--ok);color:#06210f}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;width:100%;min-height:46px}
.dr{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.inv{display:flex;gap:4px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:2px 4px}
.inv button{min-height:32px;padding:2px 10px}
.big{font-size:20px;font-weight:700;min-width:24px;text-align:center}
.mut{color:var(--mut);font-size:13px}
.rec{font-size:18px;font-weight:700;line-height:1.3}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left}
tr.best td{font-weight:700}
</style></head><body><div id="app"></div>
<script>
/* ===== Door advisor =====
 Ghost model fitted to your runs: each room has K ghosts (K=1 in ~76% of 3-door rooms) placed on doors in proportion to a
 risk weight per door type. Evidence (phone arrow, doors known safe) is applied exactly by enumerating ghost sets.
 Future value: dynamic program over room, hearts, heal potions, wands, phones and 1-room hearts. */
const WT={'?':1,low:1,mod:1.5,high:2,key:.33,web:.13,nightmare:1.7,bounce:1.27};
const KP3=[.066,.764,.16,.009],KP4=[.077,.231,.538,.077,.077];
const PI={'?':.15,low:.14,mod:.4,high:.4,key:.2,web:0,nightmare:.4,bounce:.05}; // chance a door gives a good item (small sample)
const ARROW=.55,TOT=45,REW=.5;
// ten typical rooms per phase: [best-door ghost chance with no arrow, with an arrow] (from the fitted model)
const QD={N:[[.134,.08],[.15,.093],[.175,.1],[.258,.125],[.289,.134],[.304,.153],[.326,.147],[.326,.148],[.36,.165],[.371,.169]],
 T:[[.065,.053],[.106,.07],[.125,.084],[.139,.086],[.155,.098],[.209,.113],[.269,.13],[.296,.144],[.333,.154],[.363,.165]],
 F:[[.152,.213],[.188,.244],[.205,.26],[.219,.273],[.235,.281],[.258,.286],[.279,.299],[.329,.341],[.37,.37],[.417,.408]]};
const qd=r=>r<=9?QD.N:r<=36?QD.T:QD.F;
const ix=(h,a,b,c,d)=>(((h*3+a)*3+b)*4+c)*3+d;
function perms(a){if(a.length<2)return[a];const o=[];a.forEach((x,i)=>perms(a.filter((_,j)=>j!==i)).forEach(p=>o.push([x,...p])));return o}
function setP(w,S){let t=0;for(const p of perms(S)){let rem=w.reduce((a,b)=>a+b,0),pr=1;for(const i of p){pr*=w[i]/rem;rem-=w[i]}t+=pr}return t}
function enumerate(types,G,Z){const n=types.length,w=types.map(t=>WT[t]||1),Kp=n===3?KP3:KP4,m=Array(n).fill(0),rev=Array(n).fill(0);let Zs=0,p0=0;
 for(let mask=0;mask<(1<<n);mask++){let ok=true;const S=[];for(let i=0;i<n;i++){const b=(mask>>i)&1;if(b)S.push(i);if(G.has(i)&&!b)ok=false;if(Z.has(i)&&b)ok=false}
  if(!ok)continue;const pr=(Kp[S.length]||0)*(S.length?setP(w,S):1);Zs+=pr;if(!S.length)p0+=pr;S.forEach(i=>{m[i]+=pr;rev[i]+=pr/S.length})}
 if(Zs<=0)return{m:types.map((_,i)=>G.has(i)?1:0),rev:types.map(()=>0),p0:0};
 return{m:m.map(x=>x/Zs),rev:rev.map(x=>x/Zs),p0:p0/Zs}}
// V[r][ix(h,heal,wand,phone,tempHeart)] = chance of clearing all rooms from room r on
const V=[];
function A(r,h,a,b,p,g){
 if(r>=TOT)return 1;
 if(r%9===0)return Math.max(V[r+1][ix(h,Math.min(2,a+1),b,p,g)],V[r+1][ix(h,a,Math.min(2,b+1),p,g)]); // waiting room: heal or wand
 return V[r+1][ix(h,a,b,p,g)]}
(function build(){for(let r=TOT+1;r>=1;r--){V[r]=new Array(432).fill(0);
 for(let h=0;h<=3;h++)for(let nh=0;nh<3;nh++)for(let nw=0;nw<3;nw++)for(let np=0;np<4;np++)for(let ng=0;ng<3;ng++){
  if(r>TOT){V[r][ix(h,nh,nw,np,ng)]=1;continue}
  if(h<1)continue;
  // best use of items in a room whose best door has ghost chance q (arrow = whether an arrow is already showing)
  const play=(q,arrow)=>{let best=0;
   for(let uh=0;uh<=(nh>0&&h<3?1:0);uh++)for(let im=0;im<=2;im++){
    if(im===1&&!nw)continue;if(im===2&&!ng)continue;
    for(let up=0;up<=(np>0&&!im&&!arrow?1:0);up++){
     const h2=uh?3:h,a=nh-uh,b=nw-(im===1),g=ng-(im===2),qq=im?0:q[up?1:0],pn=up?np-1:np;
     const v=(1-qq)*A(r,h2,a,b,pn,g)+qq*(h2>1?A(r,h2-1,a,b,pn,g):0);if(v>best)best=v}}
   return best};
  let tot=0;const D=qd(r);
  for(const q of D)tot+=ARROW*play([q[1],q[1]],true)+(1-ARROW)*play(q,false);
  V[r][ix(h,nh,nw,np,ng)]=tot/D.length}}})();
// best way to play this room given evidence; al={h:may drink heal, i:may use wand / 1-room heart}
function evalRoom(s,types,G,Z,al){
 const pr=enumerate(types,G,Z),m=pr.m,out=[],keys=s.keys||F.locksOff;
 for(let i=0;i<types.length;i++){
  const t=types[i];
  if(t==='key'&&!keys){out.push({i,t,g:m[i],locked:true,ev:-1});continue}
  let best=null;
  for(let uh=0;uh<=(al.h&&s.nh>0&&s.h<3?1:0);uh++)for(let im=0;im<=(al.i?2:0);im++){
   if(im===1&&!s.nw)continue;if(im===2&&!s.ng)continue;
   const h2=uh?3:s.h;let a=s.nh-uh,b=s.nw-(im===1),g=s.ng-(im===2),p=s.np;
   if(t==='web'){a=0;b=0;g=0;p=0}
   const gh=im?0:m[i],base=A(s.r,h2,a,b,p,g);
   let ev=(1-gh)*base+gh*(h2>1?A(s.r,h2-1,a,b,p,g):0);
   if(gh<1&&PI[t]){const gain=(A(s.r,h2,Math.min(2,a+1),b,p,g)+A(s.r,h2,a,b,Math.min(3,p+1),g)+A(s.r,h2,a,b,p,Math.min(2,g+1)))/3-base;ev+=REW*PI[t]*(1-gh)*gain}
   if(!best||ev>best.ev)best={i,t,g:m[i],ev,uh,im}}
  out.push(best)}
 out.sort((x,y)=>y.ev-x.ev);return{out,pr}}
function advise(){
 const n=F.n,types=F.doors.slice(0,n).map(d=>d.t),G=new Set(),Z=new Set();
 F.doors.slice(0,n).forEach((d,i)=>{if(d.a||d.b==='ghost')G.add(i);if(d.b==='safe')Z.add(i)});
 const s={h:Math.max(1,Math.min(3,S.hearts)),nh:Math.min(2,S.inv.heart_potion),nw:Math.min(2,S.inv.wand),np:Math.min(3,S.inv.phone),ng:Math.min(2,S.inv.ghost_potion),keys:S.inv.key,r:Math.min(S.room,TOT)};
 const th=s.h===3?.03:s.h===2?.015:.005,none=evalRoom(s,types,G,Z,{h:0,i:0}),all=evalRoom(s,types,G,Z,{h:1,i:1});
 const a0=none.out.find(x=>!x.locked),a1=all.out.find(x=>!x.locked);
 let plan={kind:'none',gain:0},table=none.out;
 if(a0&&a1&&a1.ev-a0.ev>=th){plan={kind:'use',gain:a1.ev-a0.ev,uh:a1.uh,im:a1.im};table=all.out}
 const base=a1?a1.ev:0;
 let phone=null;
 if(s.np>0&&!G.size&&a0){ // phone reveals a random ghost door: average the best follow-up over what it could show
  const pr=none.pr,s2={...s,np:s.np-1};let ev=0,pw=0;
  for(let j=0;j<n;j++){if(pr.rev[j]<=0)continue;const r=evalRoom(s2,types,new Set([j]),Z,{h:1,i:1}).out.find(x=>!x.locked);ev+=pr.rev[j]*(r?r.ev:0);pw+=pr.rev[j]}
  const e0=evalRoom(s2,types,G,Z,{h:1,i:1}).out.find(x=>!x.locked);ev+=Math.max(0,1-pw)*(e0?e0.ev:0);
  phone={ev,gain:ev-base};
  if(phone.gain>=th)plan={kind:'phone',gain:phone.gain,after:plan}}
 let wr=null;
 if(S.room>1&&S.room%9===1){const hv=V[s.r][ix(s.h,Math.min(2,s.nh+1),s.nw,s.np,s.ng)],wv=V[s.r][ix(s.h,s.nh,Math.min(2,s.nw+1),s.np,s.ng)];wr=hv>=wv?['heal potion',hv,wv]:['wand',wv,hv]}
 return{out:table,plan,wr,s}}
const TYPES=['?','low','mod','high','key','web','nightmare','bounce'];
const ITEMS=[['heart_potion','heal potion',2],['wand','wand',2],['phone','phone',3],['ghost_potion','1-room heart',2],['key','key',3]];
function load(){try{const s=JSON.parse(localStorage.getItem('h2adv'));return s&&s.inv?s:null}catch(e){return null}}
function persist(){try{localStorage.setItem('h2adv',JSON.stringify(S))}catch(e){}}
const fresh=()=>({room:1,hearts:3,inv:{heart_potion:0,wand:0,phone:0,ghost_potion:0,key:0}});
var S=load()||fresh(),F;
S.inv=Object.assign(fresh().inv,S.inv);
function newRoom(){F={n:S.room>=37?4:3,doors:[0,1,2,3].map(()=>({t:'?',b:'?',a:false})),locksOff:false}}
const pct=x=>Math.round(x*100)+'%',pp=x=>(x*100).toFixed(1)+'%';
const opts=(l,c)=>l.map(x=>`<option value="${x}"${x===c?' selected':''}>${x==='?'?'door type':x}</option>`).join('');
function advisor(){
 const a=advise(),p=a.plan,ok=a.out.filter(x=>!x.locked),t=ok[0],nm=x=>x.t==='?'?'unknown type':x.t;
 const held=S.inv.heart_potion+S.inv.wand+S.inv.phone+S.inv.ghost_potion;
 let rec,sub='';
 if(!ok.length)rec='Every door is locked. You need a key, or wait to see if someone uses one.';
 else if(p.kind==='phone'){
  rec=`Use your phone now, then tap "Arrow / ghost" on the door it points at and I will re-rank (about +${pp(p.gain)} run-clear chance).`;
  sub=`Without it: Door ${t.i+1} (${nm(t)}), ${pct(t.g)} ghost chance.`}
 else if(p.kind==='use'){
  const st=[];if(p.uh)st.push('drink your heal potion');if(p.im===1)st.push('use your wand (every door becomes safe)');if(p.im===2)st.push('drink your 1-room heart');
  const first=st.join(', then ');
  rec=first.charAt(0).toUpperCase()+first.slice(1)+'. '+(p.im?`Then open Door ${t.i+1} (${nm(t)}), the best item chance since no door can hurt you.`:`Then open Door ${t.i+1} (${nm(t)}), ${pct(t.g)} ghost chance.`);
  sub=`Worth about +${pp(p.gain)} run-clear chance.`}
 else{
  rec=`Open Door ${t.i+1} (${nm(t)}): ${pct(t.g)} ghost chance.`;
  if(held)sub='Keep your items for now. Spending them here would not pay off.'}
 if(ok.length&&t.t==='web'&&held+S.inv.key)sub=(sub?sub+' ':'')+'Careful: web doors steal your items.';
 const rows=a.out.map((x,k)=>`<tr${k===0&&!x.locked?' class="best"':''}><td>Door ${x.i+1} · ${nm(x)}</td><td>${x.locked?'locked':pct(p.kind==='use'&&p.im?0:x.g)}</td><td>${x.locked?'-':pct(x.ev)}</td></tr>`).join('');
 const wr=a.wr?`<div class="mut" style="margin-top:8px">Waiting room: take the <b>${a.wr[0]}</b> (estimated clear chance ${pct(a.wr[1])} vs ${pct(a.wr[2])}). If the heal applies instantly and you are at 3 hearts, take the wand.</div>`:'';
 return `<div class="card"><h2>Advice</h2><div class="rec">${rec}</div>${sub?`<div class="mut" style="margin-top:6px">${sub}</div>`:''}<table style="margin-top:10px"><tr><th>Door</th><th>Ghost</th><th>Run clears</th></tr>${rows}</table>${wr}</div>`}
function act(a,v,i){
 switch(a){
 case'room':S.room=Math.max(1,Math.min(45,S.room+ +v));newRoom();break;
 case'hearts':S.hearts=+v;break;
 case'inv':{const[k,d]=v.split('|');const mx=ITEMS.find(x=>x[0]===k)[2];S.inv[k]=Math.max(0,Math.min(mx,S.inv[k]+ +d));break}
 case'n':F.n=+v;break;
 case'type':F.doors[i].t=v;break;
 case'ghost':{const d=F.doors[i];d.a=!d.a;if(d.a)d.b='?';break}
 case'safe':{const d=F.doors[i];d.b=d.b==='safe'?'?':'safe';if(d.b==='safe')d.a=false;break}
 case'tog':F[v]=!F[v];break;
 case'next':S.room=Math.min(45,S.room+1);newRoom();break;
 case'reset':S=fresh();newRoom();break;
 }
 persist();render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.dataset.a)return;act(b.dataset.a,b.dataset.v,+b.dataset.i)});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.a)return;act(t.dataset.a,t.value,+t.dataset.i)});
function render(){
 let doors='';
 for(let i=0;i<F.n;i++){const d=F.doors[i];
  doors+=`<div class="dr"><b>Door ${i+1}</b><select data-a="type" data-i="${i}">${opts(TYPES,d.t)}</select><button class="g ${d.a?'on':''}" data-a="ghost" data-i="${i}">Arrow / ghost</button><button class="s ${d.b==='safe'?'on':''}" data-a="safe" data-i="${i}">Safe</button></div>`}
 document.getElementById('app').innerHTML=`
 <div class="card"><div class="row sp"><span class="row">Room <button data-a="room" data-v="-1">−</button><span class="big">${S.room}</span><button data-a="room" data-v="1">+</button><span class="mut">/ 45</span></span>
 <span class="row">Hearts ${[1,2,3].map(h=>`<button data-a="hearts" data-v="${h}" class="${S.hearts===h?'on':''}">${h}</button>`).join('')}</span></div>
 <h2 style="margin-top:12px">Your items</h2><div class="row">${ITEMS.map(([k,l])=>`<span class="inv">${l} <button data-a="inv" data-v="${k}|-1">−</button><b>${S.inv[k]}</b><button data-a="inv" data-v="${k}|1">+</button></span>`).join('')}</div></div>
 <div class="card"><h2>This room</h2>${doors}
 <div class="row" style="margin-top:4px"><select data-a="n"><option value="3"${F.n===3?' selected':''}>3 doors</option><option value="4"${F.n===4?' selected':''}>4 doors</option></select>
 <button data-a="tog" data-v="locksOff" class="${F.locksOff?'on':''}">Locks removed</button></div>
 <div class="mut" style="margin-top:6px">Set door types, then wait about 10 seconds for other players. Mark the door the phone arrow points at as ghost. Mark a door safe only if you know it is.</div></div>
 ${advisor()}
 <button class="pri" data-a="next">Next room</button>
 <div class="row sp" style="margin-top:10px"><span class="mut">Odds fitted to your logged runs.</span><button data-a="reset">New run</button></div>`;
}
newRoom();render();
</script></body></html>
